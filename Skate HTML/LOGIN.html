<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./CSS.css" rel="stylesheet">
    <title>LOGIN</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        form {
            background-color: #f9f9f9;
            padding: 20px;
            border-radius: 5px;
        }
        div {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input, select, textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 3px;
        }
        .error {
            color: red;
            font-size: 0.8em;
            margin-left: 10px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>

    <script src="./scripts.js"></script>
    
</head>
<body>

    <div id="header">
        <header class="d-flex flex-wrap justify-content-center py-3 mb-4 border-bottom">
            <a href="./INDEX.html" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto link-body-emphasis text-decoration-none">
              <svg class="bi me-2" width="40" height="32" aria-hidden="true"><use xlink:href="#bootstrap"></use></svg>
              <span class="fs-4">SKATE OR DIE</span>
            </a>
        </header>
    </div>            
    <h1>REGISTRO DE USUARIO</h1>
    <form id="miFormulario">
        <div>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre">
            <span id="errorNombre" class="error"></span>
        </div>
        <div>
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password">
            <span id="errorPassword" class="error"></span>
        </div>
        <div>
            <label>
                <input type="checkbox" id="terminos" name="terminos">
                Acepto los términos y condiciones
            </label>
            <span id="errorTerminos" class="error"></span>
        </div>
        <div>
            <label>Género:</label>
            <label><input type="radio" name="genero" value="masculino"> Masculino</label>
            <label><input type="radio" name="genero" value="femenino"> Femenino</label>
            <label><input type="radio" name="genero" value="otro"> Otro</label>
            <span id="errorGenero" class="error"></span>
        </div>
        <div>
            <label for="pais">País:</label>
            <select id="pais" name="pais">
                <option value="">Selecciona un país</option>
                <option value="espana">España</option>
                <option value="mexico">México</option>
                <option value="argentina">Argentina</option>
               
            </select>
            <span id="errorPais" class="error"></span>
        </div>
        <div>
            <label for="comentarios">Comentarios:</label>
            <textarea id="comentarios" name="comentarios"></textarea>
            <span id="errorComentarios" class="error"></span>
        </div>
 
        <!-- Botón para validar -->
        <button type="button" onclick="validarFormulario()">Enviar</button>
    </form>
